{% extends "base.html" %}
{% block title %}Erreur {{ status }}{% endblock %}
{% block content %}
<div class="card mx-auto mt-10 max-w-lg space-y-3">
  <h1 class="text-xl">{% if status == 404 %}Page introuvable{% elif status == 403 %}Accès refusé{% else %}Une erreur est survenue{% endif %}</h1>
  <p class="text-sm">{{ message }}</p>
  <a class="btn-secondary" href="/">Retour au tableau de bord</a>
</div>
{% endblock %}
