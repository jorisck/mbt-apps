{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="mx-auto mt-10 max-w-sm">
  <form method="post" action="{{ action }}" class="card space-y-4">
    <h1 class="text-xl">{{ title }}</h1>
    <p class="text-sm text-brand-muted">{{ intro }}</p>
    {% if error %}<p class="alert-error" role="alert">{{ error }}</p>{% endif %}
    <div>
      <label class="label" for="password">Mot de passe</label>
      <input id="password" name="password" type="password" class="input" autocomplete="new-password" minlength="12" maxlength="128" required autofocus>
      <p class="hint">12 caractères minimum. Évitez les mots de passe courants.</p>
    </div>
    <div>
      <label class="label" for="confirm">Confirmation</label>
      <input id="confirm" name="confirm" type="password" class="input" autocomplete="new-password" minlength="12" maxlength="128" required>
    </div>
    <button type="submit" class="btn-primary w-full">Enregistrer</button>
  </form>
</div>
{% endblock %}
